<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C3CE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nettwear Task Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#6C3CE9; --p2:#8B5CF6; --p-dark:#4C1FC4; --p-soft:#EFE9FF;
  --bg:#F4F2FB; --card:#FFFFFF; --text:#1C1A2E; --muted:#8A86A0; --line:#ECE9F5;
  --green:#16A34A; --green-soft:#DCFCE7;
  --orange:#EA8A00; --orange-soft:#FEF3C7;
  --red:#E11D48; --red-soft:#FFE4E6;
  --blue:#2563EB; --blue-soft:#DBEAFE;
  --grey-soft:#F1F0F6;
  --radius:22px; --shadow:0 6px 24px rgba(76,31,196,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--text);font-size:15px;line-height:1.4;padding-bottom:110px;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* ===== Hero / header ===== */
.hero{background:linear-gradient(150deg,#7C4DFF 0%,#6C3CE9 45%,#4C1FC4 100%);color:#fff;border-radius:0 0 32px 32px;padding:calc(env(safe-area-inset-top) + 18px) 0 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07);top:-90px;right:-70px}
.hero::before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-60px;left:-40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:#fff;color:var(--p);display:grid;place-items:center;font-weight:800;font-size:20px}
.brand small{display:block;opacity:.75;font-size:12px}
.brand b{font-size:17px;font-weight:700;white-space:nowrap}
.brand{min-width:0}
.live{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:7px 12px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 1.8s infinite}
.live.err .dot{background:#FB7185;animation:none}
.live.loading .dot{background:#FCD34D}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

.days{display:flex;gap:8px;margin-top:20px;position:relative;z-index:1;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:14px}
.day.on{background:#fff;color:var(--p)}
.day.pick{position:relative;display:flex;align-items:center;gap:6px}
.day.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}

.heroMain{display:flex;align-items:center;gap:18px;margin-top:22px;position:relative;z-index:1}
.ring{position:relative;width:118px;height:118px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .pct b{font-size:28px;font-weight:800;display:block;line-height:1}
.ring .pct small{font-size:11px;opacity:.8}
.heroTxt .lbl{opacity:.8;font-size:13px}
.heroTxt .big{font-size:26px;font-weight:800;line-height:1.15;margin:2px 0 6px}
.heroTxt .sub{font-size:13px;opacity:.85}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}
.stat{background:#fff;color:var(--text);border-radius:18px;padding:12px 12px 11px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .v{font-size:24px;font-weight:800;margin-top:2px}

/* ===== Sections ===== */
.sec{margin-top:22px}
.secHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.secHead h2{font-size:17px;font-weight:700}
.secHead .more{font-size:13px;color:var(--p);font-weight:600}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}

.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.who{flex:0 0 auto;width:74px;text-align:center}
.who .av{margin:0 auto 6px;position:relative}
.who .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);color:#fff}
.badge.r{background:var(--red)} .badge.g{background:var(--green)} .badge.o{background:var(--orange)}

.av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;flex:0 0 auto}
.av.sm{width:40px;height:40px;border-radius:13px;font-size:15px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}
.chip em{font-style:normal;opacity:.7;margin-left:4px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.search input{border:0;outline:0;flex:1;background:none;font-size:14px;color:var(--text)}
.search svg{flex:0 0 auto;color:var(--muted)}

.list{display:grid;gap:10px;margin-top:12px}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.task .mid{flex:1;min-width:0}
.task .t{font-weight:650;font-size:14.5px;line-height:1.3}
.task .m{font-size:12px;color:var(--muted);margin-top:3px}
.pill{flex:0 0 auto;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.late{background:var(--blue-soft);color:var(--blue)}
.pill.pending{background:var(--orange-soft);color:var(--orange)}
.pill.missed{background:var(--red-soft);color:var(--red)}
.pill.upcoming{background:var(--grey-soft);color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
.empty b{display:block;font-size:30px;margin-bottom:6px}

/* People */
.people{display:grid;gap:12px}
.person{padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.person .mid{flex:1;min-width:0}
.person .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.person .nm{font-weight:700;font-size:15px}
.person .dp{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--grey-soft);overflow:hidden;margin:8px 0 6px;display:flex}
.bar i{display:block;height:100%}
.person .meta{display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.person .meta b{color:var(--text)}
.person .meta .bad b{color:var(--red)}

/* Overdue */
.grp{padding:14px 14px 6px;margin-bottom:12px}
.grpHead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.grpHead .mid{flex:1}
.grpHead .nm{font-weight:700}
.grpHead .dp{font-size:12px;color:var(--muted)}
.od{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.od .late{color:var(--red);font-weight:700;font-size:12px;white-space:nowrap}
.grp > .od:first-child{border-top:0}
.od small{display:block;color:var(--muted);font-size:12px}

/* Week */
.chart{padding:18px 14px 12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bstack{width:100%;max-width:34px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column-reverse;background:var(--grey-soft)}
.bstack i{display:block;width:100%}
.bcol small{font-size:11px;color:var(--muted);font-weight:600}
.bcol .n{font-size:11px;font-weight:700}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .pos{width:22px;font-weight:800;color:var(--muted);text-align:center}
.rank .mid{flex:1;min-width:0}
.rank .nm{font-weight:700;font-size:14px}
.rank .sc{text-align:right;font-size:12px;color:var(--muted)}
.rank .sc b{display:block;font-size:17px;color:var(--text)}

/* Bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:460px;background:var(--card);border-radius:26px;box-shadow:0 10px 34px rgba(28,26,46,.16);display:flex;justify-content:space-around;align-items:center;padding:8px 6px;z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.nav button.on{color:var(--p)}
.nav .fab{flex:0 0 auto;width:54px;height:54px;border-radius:18px;background:linear-gradient(150deg,#8B5CF6,#5A2FD6);color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 8px 20px rgba(108,60,233,.45)}
.fab.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Bottom sheet */
.sheetBg{position:fixed;inset:0;background:rgba(20,16,40,.45);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:640px;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;transition:.3s cubic-bezier(.2,.8,.2,1);z-index:31;padding:10px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.open{transform:translate(-50%,0)}
.sheetBg.open{opacity:1;pointer-events:auto}
.grab{width:44px;height:5px;border-radius:9px;background:#D6D2E6;margin:4px auto 14px}
.sheetHead{display:flex;align-items:center;gap:12px}
.sheetHead .nm{font-size:19px;font-weight:800}
.sheetHead .dp{font-size:13px;color:var(--muted)}
.close{margin-left:auto;width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mini .stat{box-shadow:var(--shadow)}

.errBox{margin-top:20px;padding:18px;border-left:4px solid var(--red)}
.errBox b{display:block;margin-bottom:6px}
.errBox p{font-size:13.5px;color:var(--muted)}
.skel{height:64px;border-radius:18px;background:linear-gradient(90deg,#ECE9F5 0%,#F7F5FC 50%,#ECE9F5 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ===== Tablet / Laptop ===== */
@media (max-width:380px){.brand b{font-size:15px}.live{padding:6px 10px;font-size:11px}}
@media (min-width:768px){
  .list{grid-template-columns:1fr 1fr}
  .people{grid-template-columns:1fr 1fr}
  .heroGrid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:end}
  .stats{margin-top:0}
}
@media (min-width:1080px){
  .list{grid-template-columns:1fr 1fr 1fr}
  .people{grid-template-columns:1fr 1fr 1fr}
  .weekGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
  .weekGrid .sec{margin-top:0}
}
</style>
</head>
<body>

<div id="app"></div>

<nav class="nav" id="nav">
  <button data-tab="today" class="on">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Today</button>
  <button data-tab="people">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-5-5.6"/></svg>People</button>
  <button class="fab" id="refreshBtn" aria-label="Refresh">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <button data-tab="overdue">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Overdue</button>
  <button data-tab="week">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Week</button>
</nav>

<div class="sheetBg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>

<script>
/* =========================================================
   SETTINGS — edit only this block
   ========================================================= */
const CONFIG = {
  // Paste your Apps Script Web app URL here (it ends with /exec)
  API_URL: 'https://script.google.com/macros/s/AKfycbz6aYaS-aD93H66NxYJwYVN9eVUWdWdTRtbOUYKCnXocrWly570Xj_1YjzDTT1NiB3J/exec',
  DAYS_BACK: 30,      // how many past days to load (used for Overdue)
  DAYS_AHEAD: 7,      // how many future days to load
  REFRESH_SEC: 60     // auto-refresh interval in seconds
};

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDay = d => `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FREQ = {D:'Daily',W:'Weekly',M:'Monthly',F:'Fortnightly',Q:'Quarterly',Y:'Yearly',H:'Half-yearly'};
const freqName = f => FREQ[String(f||'').toUpperCase()] || f || '';
const AV_COLORS = ['#7C4DFF','#F97316','#10B981','#EC4899','#0EA5E9','#EAB308','#8B5CF6','#14B8A6','#F43F5E','#6366F1'];
const avColor = n => { let h=0; for (const c of String(n)) h = (h*31 + c.charCodeAt(0))>>>0; return AV_COLORS[h % AV_COLORS.length]; };
const avatar = (n, cls='') => `<div class="av ${cls}" style="background:${avColor(n)}">${esc(String(n||'?').trim().charAt(0).toUpperCase())}</div>`;
const today = () => midnight(new Date());

/* ===================== state ===================== */
const state = {
  rows: [], from: null, to: null, updatedAt: null, error: null, loading: false,
  tab: 'today', date: today(), filter: 'all', dept: 'all', q: '', openPerson: null
};

/* ===================== access key (entered once per device) ===================== */
const KEY_STORE = 'nettwear_dash_key';
function getKey(){ try{ return localStorage.getItem(KEY_STORE) || ''; }catch(e){ return state._key || ''; } }
function setKey(k){ state._key = k; try{ k ? localStorage.setItem(KEY_STORE,k) : localStorage.removeItem(KEY_STORE); }catch(e){} }
(function keyFromLink(){            // if the link has #key=XXXX, save it and remove it from the URL
  const m = /[#&]key=([^&]+)/.exec(location.hash);
  if (m){ setKey(decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname+location.search); }
})();

/* ===================== data (Apps Script web app, read-only) ===================== */
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = '__dash' + Date.now() + Math.floor(Math.random()*1e4);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('Request timed out. Please check your internet connection.')); }, 30000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = res => { cleanup(); resolve(res); };
    s.onerror = () => { cleanup(); reject(new Error('Could not reach the server.')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
async function api(lo, hi){
  if (!/^https:\/\/script\.google\.com\//.test(CONFIG.API_URL)) throw new Error('API_URL is not set in index.html yet.');
  const url = `${CONFIG.API_URL}?key=${encodeURIComponent(getKey())}&from=${dkey(lo)}&to=${dkey(hi)}&_=${Date.now()}`;
  try{
    const r = await fetch(url, {redirect:'follow'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){ return jsonp(url); }   // fetch na chale to fallback
}
const ymd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };

async function load(force){
  if (state.loading) return;
  const demo = new URLSearchParams(location.search).has('demo');
  if (!demo && !getKey()){ state.needKey = true; return render(); }
  const t = today();
  const lo = addDays(state.date < t ? state.date : t, -CONFIG.DAYS_BACK);
  const hi = addDays(state.date > t ? state.date : t, CONFIG.DAYS_AHEAD);
  state.loading = true; setLive();
  try{
    const res = demo ? demoData(lo,hi) : await api(lo,hi);
    if (res.status === 'denied'){ setKey(''); state.needKey = true; state.keyError = 'Incorrect access key. Please try again.'; state.loading = false; return render(); }
    if (res.status !== 'ok') throw new Error(res.message || 'Server error');
    state.rows = (res.rows || []).map(c => {
      const status = String(c[7]||'').trim();
      const actual = ymd(c[6]);
      return {
        name: String(c[0]||'').trim() || '—', dept: String(c[1]||'').trim(), id: String(c[2]??''), freq: String(c[3]||'').trim(),
        task: String(c[4]||'').trim(), planned: ymd(c[5]), actual, status,
        done: /^done|^yes|^complete/i.test(status) || !!actual
      };
    }).filter(r => r.planned && r.task);
    state.from = lo; state.to = hi; state.updatedAt = new Date(); state.error = null; state.needKey = false;
  }catch(e){ state.error = e.message || String(e); }
  state.loading = false; setLive(); render();
}

function viewKey(){
  return `<section class="hero" style="min-height:100vh;border-radius:0"><div class="wrap" style="max-width:420px;padding-top:12vh">
    <div class="logo" style="width:64px;height:64px;font-size:30px;border-radius:20px">N</div>
    <h1 style="font-size:26px;margin:18px 0 6px">Nettwear Task Dashboard</h1>
    <p style="opacity:.85;font-size:14px">Enter your access key to open the dashboard. It will be remembered on this device.</p>
    <form id="keyForm" style="margin-top:22px;display:grid;gap:12px;position:relative;z-index:1">
      <input id="keyIn" type="password" autocomplete="current-password" placeholder="Access key" required
        style="border:0;border-radius:16px;padding:15px 16px;font-size:16px;outline:0">
      <button style="background:#fff;color:var(--p);border-radius:16px;padding:15px;font-weight:800;font-size:16px">Open dashboard</button>
      ${state.keyError ? `<div style="background:rgba(255,255,255,.15);padding:10px 14px;border-radius:12px;font-size:13px">⚠️ ${esc(state.keyError)}</div>` : ''}
    </form></div></section>`;
}

/* ===================== status logic ===================== */
function stat(t){
  const T = today();
  if (t.done) return (t.actual && t.actual > t.planned) ? 'late' : 'done';
  if (t.planned < T) return 'missed';
  if (+t.planned === +T) return 'pending';
  return 'upcoming';
}
const LABEL = {done:'Done ✓', late:'Done late', pending:'Pending', missed:'Not done', upcoming:'Upcoming'};
const sameDay = (a,b) => +a === +b;
const fDept = r => state.dept === 'all' || r.dept === state.dept;
const fQ = r => !state.q || (r.task+' '+r.name+' '+r.dept).toLowerCase().includes(state.q.toLowerCase());
function summarize(list){
  const s = {total:list.length, done:0, late:0, pending:0, missed:0, upcoming:0};
  list.forEach(t => s[stat(t)]++);
  s.completed = s.done + s.late;
  s.open = s.pending + s.missed + s.upcoming;
  s.pct = s.total ? Math.round(s.completed / s.total * 100) : 0;
  return s;
}
function ring(pct, size=118, stroke=11, track='rgba(255,255,255,.22)', color='#fff'){
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s"/></svg>`;
}
const depts = () => [...new Set(state.rows.map(r=>r.dept).filter(Boolean))].sort();

/* ===================== header ===================== */
function setLive(){
  const el = $('#live'); const btn = $('#refreshBtn');
  btn.classList.toggle('spin', state.loading);
  if (!el) return;
  el.className = 'live' + (state.error ? ' err' : state.loading ? ' loading' : '');
  const txt = el.querySelector('span:last-child');
  if (state.error) txt.textContent = 'Offline';
  else if (!state.updatedAt) txt.textContent = 'Loading…';
  else {
    const s = Math.round((Date.now() - state.updatedAt)/1000);
    txt.textContent = 'Live · ' + (s < 10 ? 'just now' : s < 60 ? s+'s ago' : Math.floor(s/60)+'m ago');
  }
}
function header(inner, sub){
  const T = today(), d = state.date;
  const isY = sameDay(d, addDays(T,-1)), isT = sameDay(d,T), isTm = sameDay(d, addDays(T,1));
  const custom = !isY && !isT && !isTm;
  return `<section class="hero"><div class="wrap">
    <div class="top">
      <div class="brand"><div class="logo">N</div><div><small>Nettwear · Owner view</small><b>${sub}</b></div></div>
      <button class="live" id="live" data-logout title="Tap: refresh · Hold: logout"><span class="dot"></span><span>Loading…</span></button>
    </div>
    <div class="days">
      <button class="day ${isY?'on':''}" data-day="-1">Yesterday</button>
      <button class="day ${isT?'on':''}" data-day="0">Today</button>
      <button class="day ${isTm?'on':''}" data-day="1">Tomorrow</button>
      <label class="day pick ${custom?'on':''}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        ${custom ? fmtDay(d) : 'Pick date'}
        <input type="date" id="datePick" value="${dkey(d)}">
      </label>
    </div>
    ${inner}
  </div></section>`;
}
function errorBox(){
  return state.error ? `<div class="card errBox"><b>Could not load data</b>
    <p>${esc(state.error)}<br><br>Please check your internet connection and that the Apps Script web app is deployed (Execute as: Me, Who has access: Anyone).</p></div>` : '';
}
function skeleton(){ return `<div class="list">${'<div class="skel"></div>'.repeat(6)}</div>`; }

/* ===================== TODAY view ===================== */
function viewToday(){
  const d = state.date;
  const dayAll = state.rows.filter(r => sameDay(r.planned, d) && fDept(r));
  const s = summarize(dayAll);
  const isPast = d < today(), isFuture = d > today();
  const openLabel = isPast ? 'Not done' : isFuture ? 'Upcoming' : 'Pending';
  const openColor = isPast ? 'var(--red)' : isFuture ? 'var(--muted)' : 'var(--orange)';

  const hero = `<div class="heroGrid">
    <div class="heroMain">
      <div class="ring">${ring(s.pct)}<div class="pct"><div><b>${s.pct}%</b><small>done</small></div></div></div>
      <div class="heroTxt">
        <div class="lbl">${fmtDay(d)}</div>
        <div class="big">${s.completed} of ${s.total} tasks</div>
        <div class="sub">${s.total===0 ? 'No tasks planned for this day' : s.open===0 ? '🎉 All tasks completed' : `${s.open} task${s.open>1?'s':''} still open`}</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k"><i style="background:var(--green)"></i>Done</div><div class="v">${s.done}</div></div>
      <div class="stat"><div class="k"><i style="background:${openColor}"></i>${openLabel}</div><div class="v">${s.open}</div></div>
      <div class="stat"><div class="k"><i style="background:var(--blue)"></i>Late</div><div class="v">${s.late}</div></div>
    </div></div>`;

  // people strip
  const byP = {};
  dayAll.forEach(t => { (byP[t.name] ||= []).push(t); });
  const ppl = Object.entries(byP).map(([n,l]) => ({n, s:summarize(l)}))
    .sort((a,b) => b.s.open - a.s.open || a.n.localeCompare(b.n));
  const strip = ppl.length ? `<section class="sec"><div class="secHead"><h2>Who has work pending?</h2><button class="more" data-tab="people">All people</button></div>
    <div class="strip">${ppl.map(p => `<button class="who" data-person="${esc(p.n)}">
      <div class="av" style="background:${avColor(p.n)};position:relative">${esc(p.n.charAt(0).toUpperCase())}
        ${p.s.open ? `<span class="badge ${isFuture?'o':'r'}">${p.s.open}</span>` : `<span class="badge g">✓</span>`}</div>
      <div class="nm">${esc(p.n)}</div></button>`).join('')}</div></section>` : '';

  // filters + list
  const list = dayAll.filter(fQ);
  const cnt = {all:list.length, open:list.filter(t=>!t.done).length, done:list.filter(t=>t.done).length};
  const shown = list.filter(t => state.filter==='all' || (state.filter==='open' ? !t.done : t.done))
    .sort((a,b) => (a.done - b.done) || a.name.localeCompare(b.name) || a.task.localeCompare(b.task));
  const dp = depts();
  const filters = `<section class="sec"><div class="secHead"><h2>Tasks</h2></div>
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search task or name" value="${esc(state.q)}"></div>
    <div class="chips">
      <button class="chip ${state.filter==='all'?'on':''}" data-filter="all">All<em>${cnt.all}</em></button>
      <button class="chip ${state.filter==='open'?'on':''}" data-filter="open">${openLabel}<em>${cnt.open}</em></button>
      <button class="chip ${state.filter==='done'?'on':''}" data-filter="done">Done<em>${cnt.done}</em></button>
      ${dp.length>1 ? `<span style="width:1px;background:var(--line);flex:0 0 1px"></span>
        <button class="chip ${state.dept==='all'?'on':''}" data-dept="all">All depts</button>
        ${dp.map(x=>`<button class="chip ${state.dept===x?'on':''}" data-dept="${esc(x)}">${esc(x)}</button>`).join('')}` : ''}
    </div>
    ${shown.length ? `<div class="list">${shown.map(taskRow).join('')}</div>` :
      `<div class="empty"><b>${state.filter==='open' && cnt.all ? '🎉' : '📭'}</b>${state.filter==='open' && cnt.all ? 'Nothing pending' : 'No tasks found'}</div>`}
  </section>`;

  return header(hero, 'Daily Task Tracker') + `<div class="wrap">${errorBox()}${state.updatedAt ? strip + filters : skeleton()}</div>`;
}
function taskRow(t){
  const st = stat(t);
  return `<div class="task">${avatar(t.name,'sm')}
    <div class="mid"><div class="t">${esc(t.task)}</div>
      <div class="m">${esc(t.name)}${t.dept?' · '+esc(t.dept):''} · ${esc(freqName(t.freq))}${st==='late' && t.actual ? ' · done '+t.actual.getDate()+' '+MON[t.actual.getMonth()] : ''}</div></div>
    <span class="pill ${st}">${LABEL[st]}</span></div>`;
}

/* ===================== PEOPLE view ===================== */
function weekStats(rows){
  const T = today(), from = addDays(T,-6);
  return summarize(rows.filter(r => r.planned >= from && r.planned <= T));
}
function viewPeople(){
  const d = state.date, T = today();
  const rows = state.rows.filter(fDept);
  const names = [...new Set(rows.map(r=>r.name))];
  const data = names.map(n => {
    const mine = rows.filter(r=>r.name===n);
    return { n, dept:[...new Set(mine.map(r=>r.dept).filter(Boolean))].join(', '),
      day: summarize(mine.filter(r=>sameDay(r.planned,d))), week: weekStats(mine),
      overdue: mine.filter(r=>!r.done && r.planned < T).length };
  }).filter(p => p.day.total || p.week.total || p.overdue)
    .sort((a,b) => b.day.open - a.day.open || b.overdue - a.overdue || a.n.localeCompare(b.n));

  const allDay = summarize(rows.filter(r=>sameDay(r.planned,d)));
  const hero = `<div class="stats" style="margin-top:22px">
    <div class="stat"><div class="k">People</div><div class="v">${data.length}</div></div>
    <div class="stat"><div class="k"><i style="background:var(--green)"></i>All done</div><div class="v">${data.filter(p=>p.day.total && !p.day.open).length}</div></div>
    <div class="stat"><div class="k"><i style="background:var(--red)"></i>Work left</div><div class="v">${data.filter(p=>p.day.open).length}</div></div></div>`;

  const cards = data.map(p => {
    const s = p.day, w = s.total ? 100/s.total : 0;
    return `<button class="card person" data-person="${esc(p.n)}">${avatar(p.n)}
      <div class="mid">
        <div class="row1"><span class="nm">${esc(p.n)}</span><span class="dp">${s.total ? s.completed+'/'+s.total : 'No task'}</span></div>
        <div class="dp">${esc(p.dept)}</div>
        <div class="bar"><i style="width:${s.done*w}%;background:var(--green)"></i><i style="width:${s.late*w}%;background:var(--blue)"></i><i style="width:${s.missed*w}%;background:var(--red)"></i><i style="width:${s.pending*w}%;background:var(--orange)"></i></div>
        <div class="meta"><span>Week: <b>${p.week.pct}%</b></span>${p.overdue ? `<span class="bad">Overdue: <b>${p.overdue}</b></span>` : '<span>No overdue ✓</span>'}</div>
      </div></button>`;
  }).join('');
  return header(hero, 'Team · ' + fmtDay(d)) + `<div class="wrap">${errorBox()}
    <section class="sec"><div class="secHead"><h2>Team members</h2><span class="dp" style="font-size:12px;color:var(--muted)">${allDay.pct}% done</span></div>
    ${state.updatedAt ? (data.length ? `<div class="people">${cards}</div>` : '<div class="empty"><b>👥</b>No data</div>') : skeleton()}</section></div>`;
}

/* ===================== OVERDUE view ===================== */
function viewOverdue(){
  const T = today();
  const od = state.rows.filter(r => fDept(r) && !r.done && r.planned < T);
  const g = {};
  od.forEach(t => (g[t.name] ||= []).push(t));
  const groups = Object.entries(g).sort((a,b)=>b[1].length - a[1].length);
  const hero = `<div class="heroMain"><div class="heroTxt">
      <div class="lbl">In the last ${CONFIG.DAYS_BACK} days</div>
      <div class="big">${od.length} tasks not done</div>
      <div class="sub">${groups.length} people have overdue work</div></div></div>`;
  const body = groups.map(([n,l]) => `<div class="card grp">
      <div class="grpHead">${avatar(n,'sm')}<div class="mid"><div class="nm">${esc(n)}</div><div class="dp">${esc(l[0].dept)}</div></div><span class="pill missed">${l.length} overdue</span></div>
      ${l.sort((a,b)=>a.planned-b.planned).slice(0,8).map(t => {
        const days = Math.round((T - t.planned)/864e5);
        return `<div class="od"><div>${esc(t.task)}<small>Planned ${fmtDay(t.planned)} · ${esc(freqName(t.freq))}</small></div><span class="late">${days}d late</span></div>`;
      }).join('')}
      ${l.length>8 ? `<button class="od" style="width:100%;color:var(--p);font-weight:700" data-person="${esc(n)}">View ${l.length-8} more</button>` : ''}
    </div>`).join('');
  return header(hero, 'Overdue Work').replace(/<div class="days">[\s\S]*?<\/label>\s*<\/div>/, '')
    + `<div class="wrap">${errorBox()}<section class="sec">${state.updatedAt ? (groups.length ? `<div class="people">${body}</div>` : '<div class="empty"><b>🎉</b>No overdue work!</div>') : skeleton()}</section></div>`;
}

/* ===================== WEEK view ===================== */
function viewWeek(){
  const T = today();
  const rows = state.rows.filter(fDept);
  const days = [...Array(7)].map((_,i) => addDays(T, i-6));
  const per = days.map(d => summarize(rows.filter(r=>sameDay(r.planned,d))));
  const max = Math.max(1, ...per.map(s=>s.total));
  const wk = weekStats(rows);
  const onTime = wk.total ? Math.round(wk.done/wk.total*100) : 0;

  const hero = `<div class="heroMain">
      <div class="ring">${ring(wk.pct)}<div class="pct"><div><b>${wk.pct}%</b><small>7 days</small></div></div></div>
      <div class="heroTxt"><div class="lbl">${fmtDay(days[0])} – ${fmtDay(T)}</div>
        <div class="big">${wk.completed} / ${wk.total} done</div>
        <div class="sub">On-time: ${onTime}% · Not done: ${wk.missed + wk.pending}</div></div></div>`;

  const chart = `<section class="sec"><div class="secHead"><h2>Last 7 days</h2></div><div class="card chart">
    <div class="bars">${per.map((s,i)=>`<div class="bcol"><span class="n">${s.total?s.pct+'%':''}</span>
      <div class="bstack" style="height:${s.total/max*100}%">
        <i style="height:${s.total?s.done/s.total*100:0}%;background:var(--green)"></i>
        <i style="height:${s.total?s.late/s.total*100:0}%;background:var(--blue)"></i>
        <i style="height:${s.total?(s.missed+s.pending)/s.total*100:0}%;background:#FDA4AF"></i></div>
      <small>${sameDay(days[i],T)?'Today':DOW[days[i].getDay()]}</small></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>On time</span><span><i style="background:var(--blue)"></i>Late</span><span><i style="background:#FDA4AF"></i>Not done</span></div>
  </div></section>`;

  const names = [...new Set(rows.map(r=>r.name))];
  const rank = names.map(n => ({n, s:weekStats(rows.filter(r=>r.name===n))})).filter(x=>x.s.total)
    .sort((a,b)=> b.s.pct - a.s.pct || a.n.localeCompare(b.n));
  const board = `<section class="sec"><div class="secHead"><h2>Weekly score</h2></div><div class="card">
    ${rank.map((x,i)=>`<button class="rank" style="width:100%;text-align:left" data-person="${esc(x.n)}"><span class="pos">${i+1}</span>${avatar(x.n,'sm')}
      <div class="mid"><div class="nm">${esc(x.n)}</div>
      <div class="bar" style="margin:6px 0 0"><i style="width:${x.s.pct}%;background:${x.s.pct>=90?'var(--green)':x.s.pct>=70?'var(--orange)':'var(--red)'}"></i></div></div>
      <div class="sc"><b>${x.s.pct}%</b>${x.s.completed}/${x.s.total}</div></button>`).join('') || '<div class="empty">No data</div>'}
  </div></section>`;

  return header(hero, 'Weekly Report').replace(/<div class="days">[\s\S]*?<\/label>\s*<\/div>/, '')
    + `<div class="wrap">${errorBox()}${state.updatedAt ? `<div class="weekGrid">${chart}${board}</div>` : skeleton()}</div>`;
}

/* ===================== Person sheet ===================== */
function renderSheet(){
  const n = state.openPerson, sh = $('#sheet'), bg = $('#sheetBg');
  if (!n){ sh.classList.remove('open'); bg.classList.remove('open'); return; }
  const T = today(), d = state.date;
  const mine = state.rows.filter(r=>r.name===n);
  const day = mine.filter(r=>sameDay(r.planned,d)).sort((a,b)=>a.done-b.done);
  const od = mine.filter(r=>!r.done && r.planned < T && !sameDay(r.planned,d)).sort((a,b)=>a.planned-b.planned);
  const s = summarize(day), w = weekStats(mine);
  sh.innerHTML = `<div class="grab"></div>
    <div class="sheetHead">${avatar(n)}<div><div class="nm">${esc(n)}</div><div class="dp">${esc([...new Set(mine.map(r=>r.dept))].join(', '))}</div></div>
      <button class="close" data-close>✕</button></div>
    <div class="mini">
      <div class="stat"><div class="k">${sameDay(d,T)?'Today':fmtDay(d)}</div><div class="v">${s.completed}/${s.total}</div></div>
      <div class="stat"><div class="k">Week</div><div class="v">${w.pct}%</div></div>
      <div class="stat"><div class="k" style="color:var(--red)">Overdue</div><div class="v">${od.length}</div></div></div>
    <section class="sec"><div class="secHead"><h2>${fmtDay(d)}</h2></div>
      ${day.length ? `<div class="list" style="grid-template-columns:1fr">${day.map(taskRow).join('')}</div>` : '<div class="empty">No tasks on this day</div>'}</section>
    ${od.length ? `<section class="sec"><div class="secHead"><h2>Overdue (${od.length})</h2></div><div class="card grp">
      ${od.map(t=>`<div class="od"><div>${esc(t.task)}<small>Planned ${fmtDay(t.planned)}</small></div><span class="late">${Math.round((T-t.planned)/864e5)}d late</span></div>`).join('')}</div></section>` : ''}`;
  sh.classList.add('open'); bg.classList.add('open');
}

/* ===================== render + events ===================== */
function render(){
  document.getElementById('nav').style.display = state.needKey ? 'none' : '';
  if (state.needKey){ $('#app').innerHTML = viewKey(); return; }
  const v = {today:viewToday, people:viewPeople, overdue:viewOverdue, week:viewWeek}[state.tab]();
  const focused = document.activeElement && document.activeElement.id === 'q';
  const pos = focused ? document.activeElement.selectionStart : null;
  $('#app').innerHTML = v;
  document.querySelectorAll('#nav [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  setLive();
  if (focused){ const q = $('#q'); if (q){ q.focus(); q.setSelectionRange(pos,pos); } }
  if (state.openPerson) renderSheet();
}
function setDate(d){
  state.date = midnight(d);
  if (!state.from || state.date < addDays(state.from, 0) || state.date > state.to) load(); else render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-close]'); if (!b) return;
  if (b.id === 'refreshBtn' || b.hasAttribute('data-logout')) return load(true);
  if (b.dataset.tab){ state.tab = b.dataset.tab; window.scrollTo({top:0}); return render(); }
  if (b.dataset.day != null){ return setDate(addDays(today(), +b.dataset.day)); }
  if (b.dataset.filter){ state.filter = b.dataset.filter; return render(); }
  if (b.dataset.dept){ state.dept = b.dataset.dept; return render(); }
  if (b.dataset.person){ state.openPerson = b.dataset.person; return renderSheet(); }
  if (b.hasAttribute('data-close')){ state.openPerson = null; return renderSheet(); }
});
// Press and hold the Live pill for 1 second to log out (removes the access key)
let holdT;
document.addEventListener('pointerdown', e => { if (e.target.closest('[data-logout]')) holdT = setTimeout(() => {
  if (confirm('Log out on this device? The access key will be asked again next time.')){ setKey(''); state.needKey = true; state.rows = []; state.updatedAt = null; render(); }
}, 900); });
['pointerup','pointerleave','pointercancel'].forEach(t => document.addEventListener(t, () => clearTimeout(holdT)));
$('#sheetBg').addEventListener('click', () => { state.openPerson = null; renderSheet(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ state.q = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'keyForm'){ e.preventDefault(); const k = $('#keyIn').value.trim(); if (!k) return;
    setKey(k); state.keyError = ''; state.needKey = false; render(); load(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'datePick' && e.target.value){ const [y,m,d] = e.target.value.split('-').map(Number); setDate(new Date(y,m-1,d)); }
});

// Live updates: every REFRESH_SEC seconds and whenever the app is reopened
setInterval(() => { if (!document.hidden) load(); }, CONFIG.REFRESH_SEC * 1000);
setInterval(setLive, 5000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!state.updatedAt || Date.now() - state.updatedAt > 15000)) load();
});
// Midnight cross: date auto-shift to new "today"
let lastDay = dkey(today());
setInterval(() => { const k = dkey(today()); if (k !== lastDay){ if (dkey(state.date) === lastDay) state.date = today(); lastDay = k; load(); } }, 60000);

/* ===================== demo mode (?demo) — preview only ===================== */
function demoData(lo, hi){
  const ppl = [['Rupesh','Housekeeping',['Main Gate Mirror Cleaning','Ground Floor Cleaning']],['Mukesh','Housekeeping',['Carry Bag Refilling','Lift Mate Cleaning']],
    ['Akash','Housekeeping',['mirror cleaning counter cleaning 3rd Floor','3rd Floor Cleaning']],['Montu','Housekeeping',['Basement Floor Cleaning']],
    ['Rohit','Housekeeping',['1st Floor Cleaning']],['Akash','Stock dusting',['Stock Dusting']],['Sagar','Display',['Mannequin Dressing','Window Display Check']]];
  const rows = []; const T = today(); let id = 1;
  for (let d = new Date(lo); d <= hi; d = addDays(d,1)){
    ppl.forEach(([n,dp,tasks]) => tasks.forEach(t => {
      const weekly = dp==='Stock dusting';
      if (weekly && d.getDay()!==4) return;
      let actual = null;
      const r = Math.sin(id*12.9898 + d.getDate()*78.233)*43758.5453 % 1;
      const rnd = Math.abs(r);
      if (d < T){ if (rnd > .12) actual = rnd > .85 ? addDays(d,1) : d; }
      else if (+d === +T){ if (rnd > .45) actual = d; }
      rows.push([n, dp, id++, weekly?'W':'D', t, dkey(d), actual ? dkey(actual) : '', actual ? 'Done' : '']);
    }));
  }
  return {status:'ok', rows};
}

render();
load();
</script>
</body>
</html>
